name: Verify Exa discovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: exa-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner,repo,
              workflow_id:'verify_exa.yaml',status:'completed',per_page:100});
            for (const run of data.workflow_runs) {
              const {data:list} = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id});
              if (list.artifacts.some(a=>a.name==='exa-verification-state' && !a.expired)) {
                core.setOutput('run',run.id); return;
              }
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id});
              if (jobs.flatMap(j=>j.steps||[]).some(s=>s.name==='Validate Exa once' && s.conclusion!=='skipped'))
                throw new Error('Exa verification ledger missing; refusing another paid attempt');
            }
            if (data.workflow_runs.length===100) throw new Error('History scan limit reached');
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          name: exa-verification-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/exa-verification
      - name: Validate Exa once
        run: python -m ForecastAgent.verify_exa
        env:
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/exa-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exa-verification-state
          path: snapshots/exa-verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
