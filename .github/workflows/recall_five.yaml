name: Raw recall same five fresh pilot

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Explicit authorization for a fresh five-question budget'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: raw-recall-five-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CAMPAIGN_ROOT: snapshots/raw-recall-five-${{ github.run_id }}
      RESET_AUTHORIZATION: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Collect five with explicitly authorized fresh quotas
        run: >-
          python -m ForecastAgent.recall_pilot
          --root "$CAMPAIGN_ROOT"
          --fixture ForecastAgent/fixtures/recall_same_five.json
          --authorization "$RESET_AUTHORIZATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-recall-five-${{ github.run_id }}-state
          path: snapshots/raw-recall-five-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 90
