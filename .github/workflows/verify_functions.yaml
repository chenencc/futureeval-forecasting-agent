name: Verify ForecastAgent functions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: function-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo,
              workflow_id: 'verify_functions.yaml', status: 'completed', per_page: 1});
            if (!data.workflow_runs.length) return null;
            const run = data.workflow_runs[0];
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
            if (!artifacts.data.artifacts.some(a => a.name === 'function-verification-state' && !a.expired))
              throw new Error('Latest verification ledger unavailable; refusing budget reset');
            return run.id;
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.result != 'null'
        with:
          name: function-verification-state
          run-id: ${{ fromJSON(steps.previous.outputs.result) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/function-verification/
      - run: python -u -m ForecastAgent.verify_functions
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-verification-state
          path: snapshots/function-verification/
          if-no-files-found: error
          retention-days: 90
