name: Metaculus three historical questions
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
      resume_stopped:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: futureeval-official-worker
  cancel-in-progress: false
jobs:
  retry:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/metaculus-forecast-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      METACULUS_SUBMIT_ENABLED: 'false'
      FORECAST_MODEL: nvidia/nemotron-3.5-super-vl:free
      METACULUS_DECISION_MODEL: baseten/mammoth-1:free
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DEBUG_SESSION: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install Chromium without redundant system upgrades
        timeout-minutes: 5
        run: python -m playwright install chromium
      - name: Verify Chromium launches on the runner
        timeout-minutes: 2
        run: |
          python -B - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.set_content('<title>Metaculus browser readiness</title>')
              assert page.title()=='Metaculus browser readiness'
              browser.close()
          print('Chromium launch verified; no external page requests')
          PY
      - run: python -m metaculus_agent.doctor
      - name: Three historical questions sequentially, stop on first failure
        env:
          RESUME_STOPPED: ${{ inputs.resume_stopped }}
        run: |
          if [ "$RESUME_STOPPED" = 'true' ]; then
            python -B -m metaculus_agent.debug_batch --session "$DEBUG_SESSION" --resume-stopped --probe-default
          else
            python -B -m metaculus_agent.debug_batch --session "$DEBUG_SESSION"
          fi
