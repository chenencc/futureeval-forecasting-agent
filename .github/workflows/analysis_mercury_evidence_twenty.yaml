name: Mercury conditional original evidence twenty comparison
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: Prior twenty-case run whose preserved journals should be resumed
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis-mercury-evidence-chain
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - batch: 1
            ids: '42491,40695,44547,43822,43461'
          - batch: 2
            ids: '42489,36871,40852,40849,41206'
          - batch: 3
            ids: '41480,41489,42485,42630,43491'
          - batch: 4
            ids: '42490,43844,40417,41485,43987'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: raw-collection-100-v1-state
          run-id: 36948699455
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial-input
      - uses: actions/download-artifact@v4
        with:
          name: acquisition-supplement-100-v1
          run-id: 36961850565
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial-supplement
      - uses: actions/download-artifact@v4
        if: ${{ inputs.resume_run != '' }}
        with:
          name: mercury-evidence-chain-twenty-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial
      - name: Run frozen Mercury evidence chain
        run: python -m ForecastAgent.analysis.mercury_evidence_chain --inputs snapshots/trial-input --supplements snapshots/trial-supplement --output snapshots/trial --ids "$TRIAL_IDS"
        env:
          TRIAL_IDS: ${{ matrix.ids }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-evidence-chain-twenty-batch-${{ matrix.batch }}
          path: snapshots/trial
          retention-days: 90
