name: Monitor FutureEval questions

on:
  workflow_dispatch:
    inputs:
      snapshot_only:
        description: 'Capture questions without queuing a collection worker'
        type: boolean
        default: false
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: futureeval-question-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find the previous monitor state artifact
        id: previous
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'run_bot_on_tournament.yaml',
              branch: 'main', status: 'completed', per_page: 30,
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              // Logs verified: state lookup failed before acquisition started.
              if (run.id === 36718845323) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              if (artifacts.data.artifacts.some(a => a.name === 'futureeval-monitor-state' && !a.expired)) {
                core.setOutput('artifact', 'futureeval-monitor-state');
                return run.id;
              }
              const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id:run.id});
              const steps = jobs.jobs.flatMap(j => j.steps || []);
              const acquisition = steps.find(s => s.name === 'Save read-only question snapshot');
              const legacy = artifacts.data.artifacts.find(a => a.name === `futureeval-questions-${run.id}` && !a.expired);
              if (run.conclusion === 'success' && legacy && !steps.some(s => s.name === 'Install free document parser')) {
                core.setOutput('artifact', legacy.name);
                return run.id;
              }
              if (acquisition && acquisition.conclusion === 'skipped') continue;
              throw new Error('Latest monitor state unavailable: refusing to reset per-task search budgets');
            }
            return null;
      - name: Restore question IDs and archive cursor
        if: steps.previous.outputs.result != 'null'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.artifact }}
          run-id: ${{ fromJSON(steps.previous.outputs.result) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/monitor/
      - name: Save read-only question snapshot
        run: python -m ForecastAgent.monitor_tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          RUN_READ_ONLY_RESEARCH: '0'
          QUEUE_READ_ONLY_RESEARCH: ${{ inputs.snapshot_only && '0' || '1' }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.result != 'null' && fromJSON(steps.previous.outputs.result) || '' }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/monitor
      - name: Save state for the next poll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-monitor-state
          include-hidden-files: true
          path: |
            snapshots/monitor/state.json
            snapshots/monitor/retrieval/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload question snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-questions-${{ github.run_id }}
          path: snapshots/monitor/
          if-no-files-found: error
          retention-days: 90
