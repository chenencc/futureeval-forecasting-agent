name: Monitor FutureEval questions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: futureeval-question-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Save read-only question snapshot
        run: python scripts/monitor_tournament.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Upload question snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-questions-${{ github.run_id }}
          path: snapshots/monitor/
          if-no-files-found: error
          retention-days: 90
