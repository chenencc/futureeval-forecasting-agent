name: Checked handoff paired forty snapshot experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Legacy handoff replay or frozen identical-body selector comparison
        type: choice
        options: [legacy, enhanced_pair40, solid_collection, material_review_only, material_heldout_ten, material_benchmark, material_benchmark_round2, material_benchmark_round3, material_review_batches, material_research_loop, material_contract_pair, material_contract_heldout, material_field_regression, material_field_spans, material_field_paired_unseen, acquisition_contract_live, acquisition_ids_pilot, acquisition_provenance_pair, mercury_material_pilot, mercury_material_two_rounds, mercury_material_units, mercury_material_obligations]
        default: legacy
      resume_run:
        description: Restore exact experiment journals without resetting allowances
        required: false
      benchmark_cases:
        description: Frozen material benchmark case indices as a JSON array
        required: false
        default: '[7]'
      collection_cohort:
        description: Frozen raw acquisition cohort, without analysis or submission
        type: choice
        options: [pilot5, repair3, repair2, gap2, material_new5, material_validation5, new15, generalization5]
        default: pilot5
      collection_batch:
        description: At most five cases per dispatch; new15 has three batches
        type: choice
        options: ['1', '2', '3']
        default: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: checked-snapshot-forty
  cancel-in-progress: false
jobs:
  mercury-material-obligations:
    if: inputs.experiment == 'mercury_material_obligations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_mercury_material_v4 ForecastAgent.tests.test_mercury_material_obligations_trial ForecastAgent.tests.test_mercury_material_v3 ForecastAgent.tests.test_mercury_material_units_trial
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: mercury-material-obligations
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: snapshots/obligations-parent
      - name: Frozen regression and repair-heldout observation obligations
        run: python -u -m ForecastAgent.experiments.mercury_material_obligations_trial --output snapshots/mercury-material-obligations ${{ inputs.resume_run != '' && '--resume snapshots/obligations-parent' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-material-obligations
          path: snapshots/mercury-material-obligations
          if-no-files-found: error
          retention-days: 90
  mercury-material-units:
    if: inputs.experiment == 'mercury_material_units'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_mercury_material_v3 ForecastAgent.tests.test_mercury_material_units_trial ForecastAgent.tests.test_mercury_material_v2 ForecastAgent.tests.test_mercury_material_rounds
      - name: Frozen paired unit-aware Mercury review without new planning
        run: python -u -m ForecastAgent.experiments.mercury_material_units_trial --output snapshots/mercury-material-units
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-material-units
          path: snapshots/mercury-material-units
          if-no-files-found: error
          retention-days: 90
  mercury-material-two-rounds:
    if: inputs.experiment == 'mercury_material_two_rounds'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_mercury_material_v2 ForecastAgent.tests.test_mercury_material_rounds ForecastAgent.tests.test_mercury_material ForecastAgent.tests.test_mercury_material_pilot ForecastAgent.tests.test_acquisition_ids ForecastAgent.tests.test_acquisition_contract
      - name: Frozen regression then repair-heldout paired Mercury review
        run: python -u -m ForecastAgent.experiments.mercury_material_rounds --output snapshots/mercury-material-two-rounds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-material-two-rounds
          path: snapshots/mercury-material-two-rounds
          if-no-files-found: error
          retention-days: 90
  mercury-material-pilot:
    if: inputs.experiment == 'mercury_material_pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_mercury_material ForecastAgent.tests.test_mercury_material_pilot ForecastAgent.tests.test_acquisition_ids ForecastAgent.tests.test_acquisition_contract
      - name: Independent frozen typed Mercury and Super review without collection
        run: python -u -m ForecastAgent.experiments.mercury_material_pilot --output snapshots/mercury-material-pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-material-pilot
          path: snapshots/mercury-material-pilot
          if-no-files-found: error
          retention-days: 90
  acquisition-contract-live:
    if: inputs.experiment == 'acquisition_contract_live' || inputs.experiment == 'acquisition_ids_pilot' || inputs.experiment == 'acquisition_provenance_pair'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_acquisition_contract ForecastAgent.tests.test_acquisition_ids ForecastAgent.tests.test_acquisition_ids_pilot ForecastAgent.tests.test_acquisition_provenance ForecastAgent.tests.test_acquisition_provenance_pair
      - name: Restore exact failed pilot state for cumulative budget accounting
        if: inputs.experiment == 'acquisition_ids_pilot'
        run: gh run download 37218949703 --repo chenencc/futureeval-forecasting-agent --name acquisition-contract-live --dir snapshots/acquisition-contract-parent
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Rule planning and saved-body annotation without acquisition or submission
        run: |
          if [ "$PROFILE" = "acquisition_provenance_pair" ]; then
            gh run download 37220371858 --repo chenencc/futureeval-forecasting-agent --name acquisition-contract-live --dir snapshots/acquisition-contract-parent
            python -u -m ForecastAgent.experiments.acquisition_contract_live --provenance-pair --parent snapshots/acquisition-contract-parent --output snapshots/acquisition-contract-live
          elif [ "$PROFILE" = "acquisition_ids_pilot" ]; then
            python -u -m ForecastAgent.experiments.acquisition_contract_live --ids-pilot --parent snapshots/acquisition-contract-parent --output snapshots/acquisition-contract-live
          else
            python -u -m ForecastAgent.experiments.acquisition_contract_live --output snapshots/acquisition-contract-live
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.experiment }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acquisition-contract-live
          path: snapshots/acquisition-contract-live
          if-no-files-found: error
          retention-days: 90
  material-field-paired-unseen:
    if: inputs.experiment == 'material_field_paired_unseen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_material_contract ForecastAgent.tests.test_material_contract_heldout ForecastAgent.tests.test_field_contract ForecastAgent.tests.test_field_contract_round ForecastAgent.tests.test_field_paired_unseen
      - name: Frozen V2 and V3 comparison on identical unseen material packets
        run: python -u -m ForecastAgent.experiments.field_paired_unseen --output snapshots/material-field-paired-unseen
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-field-paired-unseen
          path: snapshots/material-field-paired-unseen
          if-no-files-found: error
          retention-days: 90
  material-field-regression:
    if: inputs.experiment == 'material_field_regression' || inputs.experiment == 'material_field_spans'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_material_contract ForecastAgent.tests.test_material_contract_heldout ForecastAgent.tests.test_field_contract ForecastAgent.tests.test_field_contract_round
      - name: Re-review saved regression excerpts with scoped field witnesses
        run: |
          if [ "$PROFILE" = "material_field_spans" ]; then
            python -u -m ForecastAgent.experiments.field_contract_round --indexed-spans --output snapshots/material-field-regression
          else
            python -u -m ForecastAgent.experiments.field_contract_round --output snapshots/material-field-regression
          fi
        env:
          PROFILE: ${{ inputs.experiment }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-field-regression
          path: snapshots/material-field-regression
          if-no-files-found: error
          retention-days: 90
  material-contract-heldout:
    if: inputs.experiment == 'material_contract_heldout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_material_contract ForecastAgent.tests.test_material_contract_heldout
      - name: Frozen annotated replay without provider calls
        run: python -m ForecastAgent.experiments.material_contract_round replay --manifest ForecastAgent/experiments/MATERIAL_CONTRACT_HELDOUT10.json --output snapshots/material-contract-heldout-replay
      - name: Single paired evaluation on previously unrepaired materials
        run: python -u -m ForecastAgent.experiments.material_contract_round paired --manifest ForecastAgent/experiments/MATERIAL_CONTRACT_HELDOUT10.json --output snapshots/material-contract-heldout-pair
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-contract-heldout-paired
          path: snapshots/material-contract-heldout-*
          if-no-files-found: error
          retention-days: 90
  material-benchmark:
    if: inputs.experiment == 'material_benchmark'
    uses: ./.github/workflows/material_benchmark.yaml
    with:
      resume_run: ${{ inputs.resume_run }}
    secrets: inherit
  material-benchmark-round2:
    if: inputs.experiment == 'material_benchmark_round2'
    uses: ./.github/workflows/material_benchmark.yaml
    with:
      resume_run: ${{ inputs.resume_run }}
      baseline_commit: dcf49ecd245ffc1f9eb4565a020ee53977b488c3
      round2: true
    secrets: inherit
  material-benchmark-round3:
    if: inputs.experiment == 'material_benchmark_round3'
    uses: ./.github/workflows/material_benchmark.yaml
    with:
      resume_run: ${{ inputs.resume_run }}
      baseline_commit: 08b43827b904fb0e4c71c4f62f6507f6674d389c
      round2: true
      coverage_v2: true
      cases: ${{ inputs.benchmark_cases || '[7]' }}
    secrets: inherit
  heldout-select:
    if: inputs.experiment == 'material_heldout_ten'
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: select
        run: python -c 'import json; from ForecastAgent.experiments.material_heldout import MANIFEST; print("cases="+json.dumps({"include":json.load(open(MANIFEST))["cases"]}))' >> "$GITHUB_OUTPUT"
  material-heldout-ten:
    if: inputs.experiment == 'material_heldout_ten'
    needs: heldout-select
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.heldout-select.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_binding_guard ForecastAgent.tests.test_material_review_only ForecastAgent.tests.test_material_heldout
      - name: Offline inventory then one bounded saved-evidence review
        run: python -u -m ForecastAgent.experiments.material_heldout --case "$CASE" --parent snapshots/heldout-parent --output snapshots/heldout --restore-fixture
        env:
          CASE: ${{ matrix.case }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FORECAST_MODEL_FALLBACK_SUPER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-heldout10-case-${{ matrix.case }}
          path: snapshots/heldout
          if-no-files-found: error
          retention-days: 90
  material-contract-pair:
    if: inputs.experiment == 'material_contract_pair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_material_contract
      - name: Replay annotated observations without provider calls
        run: python -m ForecastAgent.experiments.material_contract_round replay --output snapshots/material-contract-replay
      - name: Frozen identical-text paired material-fit evaluation
        run: python -u -m ForecastAgent.experiments.material_contract_round paired --output snapshots/material-contract-pair
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-contract-paired
          path: snapshots/material-contract-*
          if-no-files-found: error
          retention-days: 90
  material-research-loop:
    if: inputs.experiment == 'material_research_loop'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(inputs.benchmark_cases || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_saved_research_loop
      - uses: actions/download-artifact@v4
        with:
          name: solid-collection-case-${{ matrix.case }}
          run-id: '37195683563'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/raw-parent
      - uses: actions/download-artifact@v4
        with:
          name: material-review-only-case-${{ matrix.case }}
          run-id: '37203731884'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/prior-review
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: saved-research-loop-case-${{ matrix.case }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/loop-parent
      - name: Bounded saved-document agent and independent review
        run: python -u -m ForecastAgent.supplement.research_loop --parent snapshots/raw-parent --prior-review snapshots/prior-review --output snapshots/research-loop ${{ inputs.resume_run != '' && '--resume-loop snapshots/loop-parent' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FORECAST_MODEL_FALLBACK_SUPER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-research-loop-case-${{ matrix.case }}
          path: snapshots/research-loop
          if-no-files-found: error
          retention-days: 90
  material-review-only:
    if: inputs.experiment == 'material_review_only' || inputs.experiment == 'material_review_batches'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(inputs.experiment == 'material_review_batches' && '[1,2,3,4,5]' || '[1,2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$GITHUB_RUN_ATTEMPT" = 1 && test -n "$PARENT_RUN"
        env:
          PARENT_RUN: ${{ inputs.resume_run }}
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_material_fit ForecastAgent.tests.test_material_review_only ForecastAgent.tests.test_material_reading_coverage ForecastAgent.tests.test_material_delivery
      - uses: actions/download-artifact@v4
        with:
          name: solid-collection-case-${{ matrix.case }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/review-parent
      - name: Review saved evidence without acquisition
        run: python -u -m ForecastAgent.experiments.material_review_only --parent snapshots/review-parent --output snapshots/review-only --parent-run "$PARENT_RUN" ${{ inputs.experiment == 'material_review_batches' && '--need-batches' || '' }}
        env:
          PARENT_RUN: ${{ inputs.resume_run }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FORECAST_MODEL_FALLBACK_SUPER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-review-only-case-${{ matrix.case }}
          path: snapshots/review-only
          if-no-files-found: error
          retention-days: 90
  solid-collection:
    if: inputs.experiment == 'solid_collection'
    uses: ./.github/workflows/enhanced_supplement_acceptance.yaml
    with:
      experiment: solid_collection
      resume_run: ${{ inputs.resume_run }}
      collection_cohort: ${{ inputs.collection_cohort }}
      collection_batch: ${{ inputs.collection_batch }}
    secrets: inherit
  enhanced-pair:
    if: inputs.experiment == 'enhanced_pair40'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest ForecastAgent.tests.test_source_contract ForecastAgent.tests.test_enhanced_supplement ForecastAgent.tests.test_enhanced_pair40 ForecastAgent.tests.test_enhanced_pair40_resume
      - name: Require preserved journals for job reruns
        run: test "$GITHUB_RUN_ATTEMPT" = 1 || test -n "$RESUME_RUN"
        env:
          RESUME_RUN: ${{ inputs.resume_run }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: enhanced-pair40-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/enhanced-pair
      - name: Run or resume the frozen comparison
        run: |
          if [ -n "$RESUME_RUN" ]; then
            python -u -m ForecastAgent.analysis.enhanced_pair40_resume --batch "$BATCH" --output snapshots/enhanced-pair --parent-run "$RESUME_RUN"
          else
            python -u -m ForecastAgent.analysis.enhanced_pair40 --batch "$BATCH" --output snapshots/enhanced-pair
          fi
        env:
          BATCH: ${{ matrix.batch }}
          RESUME_RUN: ${{ inputs.resume_run }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-pair40-batch-${{ matrix.batch }}
          path: snapshots/enhanced-pair
          retention-days: 90
  paired:
    if: inputs.experiment == 'legacy'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cohort: [binary, nonbinary]
        batch: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary'
        with:
          name: raw-collection-100-v1-state
          run-id: 36948699455
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/raw
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary'
        with:
          name: acquisition-supplement-100-v1
          run-id: 36961850565
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/supplements
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary'
        with:
          name: mercury-evidence-chain-twenty-batch-${{ matrix.batch }}
          run-id: 37022482053
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/baseline
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'nonbinary'
        with:
          name: nonbinary-full-pipeline-batch-${{ matrix.batch }}
          run-id: 37031590213
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/raw
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: checked-snapshot-${{ matrix.cohort }}-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/paired
      - name: Replay preserved collection and repair then analyze with Mercury
        run: python -m ForecastAgent.analysis.checked_snapshot_trial --cohort "$COHORT" --batch "$BATCH" --raw snapshots/raw --supplements snapshots/supplements --baseline snapshots/baseline --output snapshots/paired
        env:
          COHORT: ${{ matrix.cohort }}
          BATCH: ${{ matrix.batch }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-snapshot-${{ matrix.cohort }}-batch-${{ matrix.batch }}
          path: snapshots/paired
          retention-days: 90
