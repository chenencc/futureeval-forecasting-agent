name: Historical collection small batch

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions this run (1-5); resumes the frozen campaign'
        default: '5'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-collection-2026-135
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Locate previous campaign state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo,
              workflow_id:'historical_collection_batch.yaml', status:'completed', per_page:100});
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              const {data: list} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id:run.id});
              const state = list.artifacts.find(a => a.name === 'historical-2026-135-state' && !a.expired);
              if (state) { core.setOutput('run', run.id); return; }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id:run.id, per_page:100});
              const step = jobs.flatMap(j => j.steps || []).find(s => s.name === 'Collect bounded historical batch');
              if (step && step.conclusion === 'skipped') continue;
              throw new Error(`Run ${run.id} has no recoverable ledger; refusing budget reset`);
            }
            if (data.workflow_runs.length === 100) throw new Error('History scan limit reached without state; refusing budget reset');
      - name: Restore frozen campaign
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: historical-2026-135-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/historical-2026-135
      - name: Initialize or validate frozen inputs
        run: python -m ForecastAgent.historical_batch init --root snapshots/historical-2026-135
        env:
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/historical-2026-135
      - name: Collect bounded historical batch
        run: python -u -m ForecastAgent.historical_batch run --root snapshots/historical-2026-135 --limit "$BATCH_LIMIT"
        env:
          BATCH_LIMIT: ${{ inputs.limit }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/historical-2026-135
      - name: Export portable archive
        if: always()
        run: python -m ForecastAgent.historical_batch archive --root snapshots/historical-2026-135 --output snapshots/historical-2026-135.zip
      - name: Preserve complete campaign state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-2026-135-state
          path: snapshots/historical-2026-135/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve downloadable archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-2026-135-archive
          path: snapshots/historical-2026-135.zip
          if-no-files-found: error
          retention-days: 90
