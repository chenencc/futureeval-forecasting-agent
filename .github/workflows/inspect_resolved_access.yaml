name: Inspect resolved question access
run-name: Read-only reference comments for post 45875
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-only-comments-45875
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact question and public comments
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlparse, parse_qs
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = build_opener(NoRedirect())
          def read(url):
              parsed = urlparse(url)
              assert parsed.scheme == 'https' and parsed.netloc == 'www.metaculus.com'
              assert parsed.path in {'/api/posts/45875/', '/api/comments/'}
              if parsed.path == '/api/comments/': assert parse_qs(parsed.query).get('post') == ['45875']
              request = Request(url, headers={'Authorization': 'Token '+os.environ['METACULUS_TOKEN'],
                  'Accept': 'application/json', 'User-Agent': 'ForecastAgent-reference-review/1.0'})
              with opener.open(request, timeout=40) as response: return json.load(response)
          post = read('https://www.metaculus.com/api/posts/45875/?include_descriptions=true')
          comments, visited = [], set()
          url = 'https://www.metaculus.com/api/comments/?post=45875&limit=100'
          for _ in range(5):
              if not url: break
              assert url not in visited
              visited.add(url)
              data = read(url)
              rows = data if isinstance(data,list) else data.get('results',[])
              comments.extend(c for c in rows if c.get('is_private') is not True)
              url = None if isinstance(data,list) else data.get('next')
          assert not url, 'Comment pagination incomplete'
          output = Path('snapshots/reference-comments-45875'); output.mkdir(parents=True,exist_ok=True)
          (output/'post.json').write_text(json.dumps(post,ensure_ascii=False,indent=2),encoding='utf-8')
          (output/'public-comments.json').write_text(json.dumps({'post_id':45875,'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),
              'comments':comments,'pages':len(visited),'complete':True,'no_model_calls':True,'no_submissions':True},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'post_id':45875,'public_comment_count':len(comments),'pages':len(visited),'no_model_calls':True,'no_submissions':True}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reference-comments-45875
          path: snapshots/reference-comments-45875/
          retention-days: 7
          if-no-files-found: error
