name: Metaculus HF bounded acceptance
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        default: storage
        options: [storage, full, resume]
      source_prefix:
        type: string
        default: ''
      post_id:
        type: string
        default: ''
      question_id:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: metaculus-hf-bounded-acceptance
  cancel-in-progress: false
jobs:
  accept:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      FORECAST_MODEL: nvidia/nemotron-3.5-super-vl:free
      METACULUS_DECISION_MODEL: baseten/mammoth-1:free
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install browser for explicit full acceptance
        if: inputs.kind == 'full'
        run: python -m playwright install --with-deps chromium
      - run: python -m metaculus_agent.doctor
      - name: Finite private-HF acceptance (never submits)
        env:
          KIND: ${{ inputs.kind }}
          POST_ID: ${{ inputs.post_id }}
          QUESTION_ID: ${{ inputs.question_id }}
          SOURCE_PREFIX: ${{ inputs.source_prefix }}
        run: python -B -m metaculus_agent.acceptance --kind "$KIND" --post-id "$POST_ID" --question-id "$QUESTION_ID" --source-prefix "$SOURCE_PREFIX"
