name: Metaculus HF three historical arrivals
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
        description: 'Unique 32-hex debug session; all output stays in HF _debug'
      resume_first_analysis:
        type: boolean
        default: false
        description: 'Restore the failed first case; never recollect its evidence'
permissions:
  contents: read
concurrency:
  group: futureeval-official-worker
  cancel-in-progress: false
jobs:
  case1:
    name: Historical arrival 1
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/metaculus-analysis-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      METACULUS_SUBMIT_ENABLED: 'false'
      FORECAST_MODEL: nvidia/nemotron-3.5-super-vl:free
      METACULUS_DECISION_MODEL: baseten/mammoth-1:free
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DEBUG_SESSION: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m metaculus_agent.doctor
      - name: One historical arrival, stop sequence on failure
        env:
          RESUME_ANALYSIS: ${{ inputs.resume_first_analysis }}
        run: |
          if [ "$RESUME_ANALYSIS" = 'true' ]; then
            python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 1 --resume-analysis
          else
            python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 1
          fi
      - name: Read saved HF diagnostics only
        if: always()
        run: python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 1 --inspect

  case2:
    name: Historical arrival 2
    needs: case1
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/metaculus-analysis-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      METACULUS_SUBMIT_ENABLED: 'false'
      FORECAST_MODEL: nvidia/nemotron-3.5-super-vl:free
      METACULUS_DECISION_MODEL: baseten/mammoth-1:free
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DEBUG_SESSION: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m metaculus_agent.doctor
      - name: One historical arrival, stop sequence on failure
        run: python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 2
      - name: Read saved HF diagnostics only
        if: always()
        run: python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 2 --inspect

  case3:
    name: Historical arrival 3
    needs: case2
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/metaculus-analysis-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      METACULUS_SUBMIT_ENABLED: 'false'
      FORECAST_MODEL: nvidia/nemotron-3.5-super-vl:free
      METACULUS_DECISION_MODEL: baseten/mammoth-1:free
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DEBUG_SESSION: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m metaculus_agent.doctor
      - name: One historical arrival, stop sequence on failure
        run: python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 3
      - name: Read saved HF diagnostics only
        if: always()
        run: python -B -m metaculus_agent.debug_sequence --session "$DEBUG_SESSION" --case-index 3 --inspect

