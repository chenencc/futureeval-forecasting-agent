name: Official recovery fault tests
on:
  push:
    branches: [codex/official-recovery-v105]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - run: python -m unittest ForecastAgent.tests.test_official_recovery ForecastAgent.tests.test_release_1_0_5 -q
