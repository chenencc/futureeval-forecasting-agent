name: Market repricing research monitor

on:
  # An external cron-job.org job dispatches this workflow on main.
  # Keep the workflow enabled; only its built-in schedule is removed.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: market-repricing-monitor-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MARKET_REPRICING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MARKET_PIPELINE_SHA: ${{ vars.MARKET_REPRICING_SHA }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.MARKET_REPRICING_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .transport
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official map core dependencies
        run: python -m pip install -r ForecastAgent/market_repricing/requirements-official-map.txt
      - name: Verify independent immutable market release
        run: python -m ForecastAgent.market_repricing.deployment
      - name: Run independent sidecar regression gates
        run: python -m unittest discover -s ForecastAgent/market_repricing/tests -v
      - name: Restore exact monitor checkpoint
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role monitor --root snapshots/market-monitor --branch "$GITHUB_REF_NAME"
      - name: Restore latest completed worker for labels
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role worker --root snapshots/market-worker --branch "$GITHUB_REF_NAME" --projection
      - name: Validate pending market version compatibility
        run: python -m ForecastAgent.market_repricing.deployment --worker-root snapshots/market-worker --monitor-root snapshots/market-monitor
      - name: Run research monitor
        run: python -m ForecastAgent.market_repricing monitor --root snapshots/market-monitor --worker snapshots/market-worker
      - name: Seal interrupted monitor state
        if: always()
        run: |
          if [ -f snapshots/market-monitor/state.json ]; then
            python -m ForecastAgent.market_repricing.deployment --record-root snapshots/market-monitor
            python -c "from ForecastAgent.market_repricing.common import seal; seal('snapshots/market-monitor')"
          fi
      - name: Build bounded lossless monitor checkpoint
        id: monitor_pack
        if: always()
        run: |
          if [ -f snapshots/market-monitor/state.json ]; then
            python .transport/ForecastAgent/infrastructure/market_checkpoint.py publish --root snapshots/market-monitor --output snapshots/market-monitor-packed
          else
            exit 1
          fi
      - name: Publish independent monitor checkpoint
        if: always() && steps.monitor_pack.outcome == 'success'
        id: checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: market-repricing-v2-monitor-state
          path: snapshots/market-monitor-packed
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - name: Build lightweight local synchronization catalog
        id: local_catalog
        if: always() && steps.checkpoint.outcome == 'success'
        continue-on-error: true
        run: python .transport/ForecastAgent/infrastructure/local_sync_export.py --stream market-monitor --source market-repricing-v2-monitor-state=snapshots/market-monitor-packed --summary-root market-repricing-v2-monitor-state=snapshots/market-monitor --source-id market-repricing-v2-monitor-state=${{ steps.checkpoint.outputs.artifact-id }} --output snapshots/local-catalog
      - name: Publish lightweight local synchronization catalog
        if: always() && steps.local_catalog.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-local-catalog-v1-market-monitor
          path: snapshots/local-catalog/
          retention-days: 90
          if-no-files-found: error
      - name: Write visible health summary
        if: always()
        run: |
          if [ -f snapshots/market-monitor/report.json ]; then
            echo '## Read-only market discovery and quote health' >> "$GITHUB_STEP_SUMMARY"
            cat snapshots/market-monitor/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
