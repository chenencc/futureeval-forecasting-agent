name: Current information new five pilot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: current-new-five-20261001
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAMPAIGN_ROOT: snapshots/current-new-five-20261001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Locate this experiment's previous state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo,
              workflow_id:'current_new_five.yaml', status:'completed', per_page:100});
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              const {data: list} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id:run.id});
              if (list.artifacts.some(a => a.name === 'current-new-five-20261001-state' && !a.expired)) {
                core.setOutput('run', run.id); return;
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id});
              const step = jobs.flatMap(j=>j.steps||[]).find(s=>s.name.startsWith('Collect new case '));
              if (!step || step.conclusion === 'skipped') continue;
              throw new Error(`Run ${run.id} started collection without recoverable state; refusing budget reset`);
            }
            if (data.workflow_runs.length === 100) throw new Error('State history exhausted; refusing budget reset');
      - name: Restore this experiment's frozen ledgers
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: current-new-five-20261001-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/current-new-five-20261001
      - name: Prepare frozen new cases and current-information policy
        run: python -m ForecastAgent.current_pilot prepare --root "$CAMPAIGN_ROOT" --fixture ForecastAgent/fixtures/current_new_five_20261001.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Collect new case 44414
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -u -m ForecastAgent.current_pilot run --root "$CAMPAIGN_ROOT" --question 44414
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Collect new case 44247
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -u -m ForecastAgent.current_pilot run --root "$CAMPAIGN_ROOT" --question 44247
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Collect new case 43992
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -u -m ForecastAgent.current_pilot run --root "$CAMPAIGN_ROOT" --question 43992
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Collect new case 43479
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -u -m ForecastAgent.current_pilot run --root "$CAMPAIGN_ROOT" --question 43479
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Collect new case 44798
        if: ${{ !cancelled() && (success() || failure()) }}
        run: python -u -m ForecastAgent.current_pilot run --root "$CAMPAIGN_ROOT" --question 44798
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.run }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/current-new-five-20261001
      - name: Check packages and required search attempts
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CAMPAIGN_ROOT'])
          batch=json.loads((root/'batch.json').read_text())
          rows=[]; violations=[]
          for qid in batch['tasks']:
            path=root/'tasks'/qid/'bundle.json'
            if not path.exists():
              violations.append(qid+': missing task ledger'); continue
            b=json.loads(path.read_text()); result=b.get('result') or {}
            row={'question_id':qid,'session_state':b.get('session_state'),
              'tavily_attempts':len(b['searches']),'exa_attempts':len(b['exa_searches']),
              'model_http_attempts':len(b.get('model_attempts',[])),
              'acquisition_complete':result.get('acquisition_complete'),
              'required_exa':result.get('exa_requirement'), 'gaps':result.get('gaps',[])}
            rows.append(row)
            if not result: violations.append(qid+': missing package')
            if row['tavily_attempts']>3 or row['exa_attempts']>1: violations.append(qid+': search cap exceeded')
            if not (result.get('exa_requirement') or {}).get('attempt_requirement_met'): violations.append(qid+': required Exa unmet')
            if any(s.get('attempts_after',0)-s.get('attempts_before',0)>12 for s in b.get('sessions',[])): violations.append(qid+': model dispatch cap exceeded')
          summary={'schema':'five_dispatch_summary_v1','tasks':rows,'violations':violations,
                   'quality_pass':all(row.get('acquisition_complete') for row in rows) and len(rows)==5,
                   'scope':'Package/resource gate only; raw evidence requires a separate quality audit.'}
          (root/'dispatch_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary))
          if violations: raise SystemExit('Unmet requirements preserved in state; no automatic quota restart')
          PY
      - name: Export portable archive
        if: always()
        run: python -m ForecastAgent.historical_batch archive --root "$CAMPAIGN_ROOT" --output snapshots/current-new-five-20261001.zip
      - name: Preserve complete experiment state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-new-five-20261001-state
          path: snapshots/current-new-five-20261001/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve portable archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-new-five-20261001-archive
          path: snapshots/current-new-five-20261001.zip
          if-no-files-found: error
          retention-days: 90
