name: Metaculus saved debug diagnostics
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
      reader_public_key:
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      READER_PUBLIC_KEY: ${{ inputs.reader_public_key }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==1.33.0 pyarrow==21.0.0 PyNaCl==1.6.0
      - name: Encrypted readback of saved predictions, zero provider calls
        run: |
          python -B - <<'PY'
          import base64,hashlib,io,json,os,tempfile
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi,hf_hub_download
          from nacl.public import PublicKey,SealedBox
          session='1044847f98034a4f86e871811b75f8c5'
          pre='metaculus/_debug/'+session
          token=os.environ['HF_TOKEN'];repo='chchen13/forecastagent-data';api=HfApi(token=token)
          info=api.repo_info(repo,repo_type='dataset');assert info.private
          def read(key,rev):
           with tempfile.TemporaryDirectory() as d:return Path(hf_hub_download(repo,key,repo_type='dataset',revision=rev,token=token,local_dir=d,force_download=True)).read_bytes()
          state=json.loads(read(pre+'/_control/checkpoint.json',info.sha));rows=[]
          for qid in ['46432','46431']:
           task=state['tasks'][qid];rev=task['analysis_revision'];key=pre+'/'+task['analysis_key'][len('metaculus/'):]
           raw=read(key,rev);manifest=json.loads(read(key.rsplit('/',1)[0]+'/manifest.json',rev))
           assert hashlib.sha256(raw).hexdigest()==manifest['files']['analysis.parquet']['sha256']
           result=json.loads(pq.read_table(io.BytesIO(raw)).to_pylist()[0]['payload'])
           assert result['question_id']=='metaculus:'+qid and result['run_id']==task['run_id']
           candidate=result['candidate'];request=task['request']
           rows.append(dict(question_id=qid,question=request.get('question'),question_type=request.get('question_type'),scaling=request.get('scaling'),inbound_outcome_count=request.get('inbound_outcome_count'),open_lower_bound=request.get('open_lower_bound'),open_upper_bound=request.get('open_upper_bound'),payload=candidate['payload'],selection=candidate['selection'],decision_model=result['decision_model'],analysis_revision=rev,analysis_sha256=hashlib.sha256(raw).hexdigest(),snapshot_id=result['snapshot_id'],finished_at=result['finished_at'],verified=True))
          data=json.dumps(dict(session=session,cases=rows,provider_calls=0,submissions=0)).encode()
          encrypted=SealedBox(PublicKey(base64.b64decode(os.environ['READER_PUBLIC_KEY']))).encrypt(data)
          print('PRIVATE_FORECAST_READBACK='+base64.b64encode(encrypted).decode())
          PY
