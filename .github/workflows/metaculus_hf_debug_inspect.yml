name: Metaculus saved debug diagnostics
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
      reader_public_key:
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      READER_PUBLIC_KEY: ${{ inputs.reader_public_key }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==1.33.0 pyarrow==21.0.0 PyNaCl==1.6.0 requests==2.32.3
      - name: Encrypted readback of saved predictions, zero provider calls
        run: |
          python -B - <<'PY'
          import base64,hashlib,io,json,os,tempfile
          from pathlib import Path
          from collections import defaultdict
          import pyarrow as pa,pyarrow.parquet as pq
          from huggingface_hub import HfApi,hf_hub_download
          from nacl.public import PublicKey,SealedBox
          repo='chchen13/forecastagent-data';session='eec3bd3fcd28430b862376553259e65a';base='metaculus/_debug/'+session
          api=HfApi(token=os.environ['HF_TOKEN']);info=api.repo_info(repo,repo_type='dataset');assert info.private;revision=info.sha
          files={x.path:x.size for x in api.list_repo_tree(repo,base,recursive=True,revision=revision,repo_type='dataset') if hasattr(x,'size')}
          def read(key):
           with tempfile.TemporaryDirectory() as d:return Path(hf_hub_download(repo,key,repo_type='dataset',revision=revision,token=os.environ['HF_TOKEN'],local_dir=d,force_download=True)).read_bytes()
          state=json.loads(read(base+'/_control/checkpoint.json'));owners=defaultdict(set);rows=[]
          for index,qid in enumerate(['46429','46428','46427'],1):
           task=state['tasks'].get(qid);row=dict(case_index=index,question_id=qid,status=task.get('status') if task else 'not_run',context_bytes=0,analysis_bytes=0,direct_files_bytes=0,runtime_hashes=[],archive_files=0)
           if task:
            physical=lambda k:base+'/'+k[len('metaculus/'):]
            pre=physical(task['context_key']).rsplit('/',1)[0] if task.get('context_key') else None
            direct={k:v for k,v in files.items() if (pre and k.startswith(pre+'/')) or k.startswith(base+'/case-'+str(index)+'/')}
            row.update(title=task.get('request',{}).get('question'),last_error=task.get('last_error'),prefix=pre,direct_files_bytes=sum(direct.values()),direct_file_sizes=direct,attempts=task.get('attempts'))
            hashes=set()
            if task.get('runtime_archive_key'):
             archive=json.loads(read(physical(task['runtime_archive_key'])));hashes.update(archive['runtime'].values());row['archive_files']=len(archive['runtime'])
            else:hashes.update(v for k,v in state['runtime'].items() if k.startswith('tasks/'+qid+'/'))
            row['runtime_hashes']=sorted(hashes)
            for h in hashes:owners[h].add(qid)
            for name in ['context','analysis']:
             if task.get(name+'_key'):row[name+'_bytes']=files[physical(task[name+'_key'])]
            if pre and pre+'/context.parquet' in files:
             raw=read(pre+'/context.parquet');manifest=json.loads(read(pre+'/manifest.json'));assert hashlib.sha256(raw).hexdigest()==manifest['files']['context.parquet']['sha256']
             value=json.loads(pq.read_table(pa.BufferReader(raw)).to_pylist()[0]['payload']);intel=value['intelligence'];sources={x['source_id']:x for x in intel['evidence']['sources']};snap=next(x for x in intel['evidence']['snapshots'] if x['snapshot_id']==value['snapshot_id'])
             row.update(snapshot_id=value['snapshot_id'],searches=[dict(provider=x['provider'],query=x['query'],status=x['status'],results=len(x['results'])) for x in intel['searches']],raw_search_responses=len(value.get('raw_search_responses',[])),raw_search_bytes=sum(x['body_bytes'] for x in value.get('raw_search_responses',[])),materials=[dict(binding=x,source={k:sources[x['source_id']].get(k) for k in ['source_id','source_url','status','http_status','error_code','evidence_kind','text_sha256']},text_characters=len(intel['evidence']['texts'].get(sources[x['source_id']].get('text_sha256'),''))) for x in snap['materials']],gap_codes=[x.get('code') for x in snap.get('gaps',[])],test_only=value.get('test_only'))
           rows.append(row)
          for row in rows:
           hashes=row.pop('runtime_hashes');owned=[h for h in hashes if len(owners[h])==1];shared=[h for h in hashes if len(owners[h])>1]
           row['exclusive_runtime_bytes']=sum(files[base+'/_control/objects/'+h] for h in owned)
           row['shared_runtime_referenced_bytes']=sum(files[base+'/_control/objects/'+h] for h in shared)
           row['exclusive_total_bytes']=row['direct_files_bytes']+row['exclusive_runtime_bytes']
          total=sum(files.values());result=dict(session=session,revision=revision,cases=rows,session_current_bytes=total,session_current_files=len(files),session_shared_control_and_history_bytes=total-sum(x['exclusive_total_bytes'] for x in rows),completed_cases=state['debug']['completed'],physical_billing_claimed=False,provider_calls=0,submissions=0)
          sealed=SealedBox(PublicKey(base64.b64decode(os.environ['READER_PUBLIC_KEY']))).encrypt(json.dumps(result).encode());print('PRIVATE_FORECAST_READBACK='+base64.b64encode(sealed).decode())
          PY
