name: Metaculus encrypted saved quality inspection
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
      reader_public_key:
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      READER_PUBLIC_KEY: ${{ inputs.reader_public_key }}
      SOURCE_MAIN: f5ea9bac5b9d4d7994008337f16347abb260e871
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==1.33.0 pyarrow==21.0.0 PyNaCl==1.6.0
      - name: Encrypted exact-revision saved quality readback
        run: |
          python -B - <<'PY'
          import base64,hashlib,io,json,os,tempfile,zlib
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi,hf_hub_download
          from nacl.public import PublicKey,SealedBox
          repo='chchen13/forecastagent-data';token=os.environ['HF_TOKEN'];api=HfApi(token=token)
          info=api.repo_info(repo,repo_type='dataset');assert info.private;revision=info.sha
          read_count=0
          def read(key):
           global read_count
           assert key.startswith('metaculus/') and '..' not in key.split('/')
           read_count+=1
           with tempfile.TemporaryDirectory() as d:
            return Path(hf_hub_download(repo,key,repo_type='dataset',revision=revision,token=token,local_dir=d,force_download=True)).read_bytes()
          state=json.loads(read('metaculus/_control/checkpoint.json'));rows=[]
          for qid in ('46510',):
           task=state['tasks'][qid];pre=task['context_key'].rsplit('/',1)[0];manifest=json.loads(read(pre+'/manifest.json'))
           assert str(manifest['question_id'])==qid and manifest['run_id']==task['run_id']
           row=dict(task=task,manifest=manifest,hf_revision=revision,artifacts={},runtime_paths=[],analysis_inputs={})
           for kind in ('context','analysis'):
            key=task[kind+'_key'];raw=read(key);name=kind+'.parquet';proof=manifest['files'][name]
            assert hashlib.sha256(raw).hexdigest()==proof['sha256'] and len(raw)==proof['bytes']
            with pq.ParquetFile(io.BytesIO(raw),page_checksum_verification=True) as pf:value=json.loads(pf.read().to_pylist()[0]['payload'])
            assert value['question_id']=='metaculus:'+qid and value['run_id']==task['run_id'] and value['snapshot_id']==task['snapshot_id']
            digest=hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
            row['artifacts'][kind]=dict(key=key,bytes=len(raw),sha256=proof['sha256'],verified=True)
            row[kind]=value
           row['submission']=json.loads(read(pre+'/submission.json'))
           archive=json.loads(read(task['runtime_archive_key']));row['runtime_paths']=list(archive['runtime'])
           for name,h in archive['runtime'].items():
            if '/analysis/' in name and name.endswith('/input.json'):
             raw=read('metaculus/_control/objects/'+h);assert hashlib.sha256(raw).hexdigest()==h
             row['analysis_inputs'][name]=json.loads(raw)
           rows.append(row)
          value=dict(checked_revision=revision,source_main=os.environ['SOURCE_MAIN'],cases=rows,hf_reads=read_count,models=0,searches=0,submissions=0,hf_writes=0)
          raw=zlib.compress(json.dumps(value,ensure_ascii=False).encode(),9)
          sealed=base64.b64encode(SealedBox(PublicKey(base64.b64decode(os.environ['READER_PUBLIC_KEY']))).encrypt(raw)).decode()
          for i in range(0,len(sealed),24000):print('PRIVATE_QUALITY_CHUNK='+str(i//24000)+':'+sealed[i:i+24000])
          print('PRIVATE_QUALITY_COMPLETE='+str((len(sealed)+23999)//24000))
          PY
