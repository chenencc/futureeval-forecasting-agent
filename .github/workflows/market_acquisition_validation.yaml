name: Market acquisition saved-state promotion gates
on:
  push:
    branches: [codex/market-acquisition-p0, codex/acquisition-shared-p0, codex/market-discovery-windows]
    paths: ['ForecastAgent/market_repricing/**', 'ForecastAgent/acquisition_shared/**', '.github/workflows/market_acquisition_validation.yaml']
  workflow_dispatch:
  pull_request:
    paths: ['ForecastAgent/market_repricing/**', 'ForecastAgent/acquisition_shared/**', '.github/workflows/market_acquisition_validation.yaml']
permissions:
  contents: read
  actions: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .transport
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: 1a88d3b3390a6d6b92172ccd223b5f8a7948bfce
          path: .intake-baseline
          persist-credentials: false
      - name: Install native offline dependencies
        run: python -m pip install -r ForecastAgent/market_repricing/requirements-official-map.txt
      - name: Verify discovery and native pipeline regression gates without providers
        run: python -m unittest discover -s ForecastAgent/market_repricing/tests -v
      - name: Restore latest completed production checkpoint without provider access
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role worker --root snapshots/worker --branch main
      - name: Verify exact task, quota and original-file preservation
        run: python -m ForecastAgent.market_repricing.tests.verify_acquisition_promotion --root snapshots/worker --output snapshots/receipts/acquisition-promotion.json
      - name: Restore production monitor without provider access
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role monitor --root snapshots/monitor --branch main
      - name: Verify exact pending monitor-to-worker version continuity without writes
        run: MARKET_PIPELINE_SHA="$(git rev-parse HEAD)" python -m ForecastAgent.market_repricing.deployment --checkout . --worker-root snapshots/worker --monitor-root snapshots/monitor > snapshots/receipts/pending-version-continuity.json
      - name: Verify creation-window discovery without changing restored originals
        run: python -m ForecastAgent.market_repricing.tests.verify_discovery_preservation --root snapshots/monitor --output snapshots/receipts/discovery-preservation.json
      - name: Verify intake against frozen actual admissions without provider calls
        run: python -m ForecastAgent.market_repricing.tests.verify_intake_preservation --root snapshots/monitor --baseline .intake-baseline/ForecastAgent/market_repricing/venues.py --output snapshots/receipts/intake-preservation.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-acquisition-promotion
          path: snapshots/receipts
          if-no-files-found: error
          retention-days: 30
