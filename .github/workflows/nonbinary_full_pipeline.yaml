name: Nonbinary twenty original acquisition repair Mercury
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: Restore this pipeline's complete original ledgers
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: nonbinary-full-pipeline
  cancel-in-progress: false
jobs:
  pilot:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-supplement.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mercury-nonbinary-twenty-batch-${{ matrix.batch }}
          run-id: 37027378998
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/seed
      - uses: actions/download-artifact@v4
        if: ${{ inputs.resume_run != '' }}
        with:
          name: nonbinary-full-pipeline-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/full-pipeline
      - name: Original acquisition then independent supplement then Mercury rereading
        run: python -m ForecastAgent.analysis.nonbinary_full_pipeline --output snapshots/full-pipeline --seed snapshots/seed --batch "$BATCH"
        env:
          BATCH: ${{ matrix.batch }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FORECAST_MODEL_FALLBACK_SUPER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonbinary-full-pipeline-batch-${{ matrix.batch }}
          path: snapshots/full-pipeline
          retention-days: 90
