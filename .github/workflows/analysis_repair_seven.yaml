name: Seven-question analysis contract repair trial
on:
  workflow_dispatch:
    inputs:
      resume_run:
        type: string
        default: ''
        description: Exact prior trial run whose journals must be preserved
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis-repair-seven
  cancel-in-progress: false
jobs:
  analyze:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: raw-collection-100-v1-state
          run-id: 36948699455
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial-input
      - uses: actions/download-artifact@v4
        with:
          name: acquisition-supplement-100-v1
          run-id: 36961850565
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial-supplement
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: analysis-repair-seven-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/trial
      - name: Run frozen five-question analysis batch
        run: python -m ForecastAgent.analysis.three_route_trial --inputs snapshots/trial-input --supplements snapshots/trial-supplement --output snapshots/trial --batch ${{ matrix.batch }} --cohort ForecastAgent/analysis/error_seven_cohort.json --audit-contract --metadata ForecastAgent/analysis/error_seven_time_metadata.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-repair-seven-batch-${{ matrix.batch }}
          path: snapshots/trial
          retention-days: 90
