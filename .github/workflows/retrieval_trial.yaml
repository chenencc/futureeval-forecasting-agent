name: Frozen frontier paired acquisition experiment

on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Exact prior run to restore; no automatic quota restart'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: intelligent-frontier-five-v1
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        question: ['36871', '43494', '43501', '43991', '44801']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Reject untracked workflow retries
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Use a new dispatch with the exact resume_run artifact; never rerun with empty ledgers.'
            exit 1
          fi
      - name: Restore exact previous case state
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: intelligent-frontier-${{ matrix.question }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/intelligent-frontier/${{ matrix.question }}
      - name: Frozen input and offline contract checks
        run: |
          python -m ForecastAgent.acquisition.frontier_compare --preflight
          python -m unittest ForecastAgent.tests.test_intelligent_acquisition ForecastAgent.tests.test_frontier_compare
      - name: Compare two model policies over identical saved sources
        run: python -u -m ForecastAgent.acquisition.frontier_compare --question-id "$CASE_ID" --root "snapshots/intelligent-frontier/$CASE_ID" --replicate-super
        env:
          CASE_ID: ${{ matrix.question }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
          FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          FORECAST_MODEL_FALLBACK_SUPER: '0'
      - name: Preserve complete paired experiment state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-frontier-${{ matrix.question }}
          path: snapshots/intelligent-frontier/${{ matrix.question }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
