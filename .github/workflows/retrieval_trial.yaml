name: ForecastAgent release acceptance
run-name: ForecastAgent v1.0.4 offline Linux acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_policy:
        description: Immutable release acceptance without provider calls
        type: choice
        options: ['release_1_0_4']
        default: release_1_0_4
        required: true
permissions:
  contents: read
concurrency:
  group: forecastagent-v104-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Validate source, recovery and mixed-format queue
        run: |
          python - <<'PY'
          import json, os, sys, unittest
          from pathlib import Path
          from unittest.mock import patch
          from ForecastAgent.acquisition.pipeline import verify_baseline
          from ForecastAgent.releases import stress
          from ForecastAgent.releases.manifest import verify
          frozen = verify(expected_version='1.0.4')
          baseline = verify_baseline()
          output = Path('snapshots/v104-acceptance')
          output.mkdir(parents=True, exist_ok=True)
          original = stress.run
          stress_reports = []
          def capture(*args, **kwargs):
              report = original(*args, **kwargs)
              stress_reports.append(report)
              return report
          with patch.object(stress, 'run', side_effect=capture):
              suite = unittest.defaultTestLoader.loadTestsFromName('ForecastAgent.tests.test_release_1_0_4')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = {'release_version': '1.0.4', 'commit': os.environ['GITHUB_SHA'],
                    'python': sys.version, 'mode': 'offline engineering acceptance',
                    'tests_run': result.testsRun, 'errors': len(result.errors),
                    'failures': len(result.failures), 'passed': result.wasSuccessful(),
                    'frozen_source_count': len(frozen['files_sha256_lf']),
                    'stress_reports': stress_reports, 'real_provider_calls': 0,
                    'real_platform_submissions': 0}
          (output / 'acceptance.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          assert result.wasSuccessful() and result.testsRun == 22
          assert len(stress_reports) == 1 and stress_reports[0]['question_count'] == 100
          assert stress_reports[0]['duplicate_posts_on_replay'] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-v104-acceptance-${{ github.run_id }}
          path: snapshots/v104-acceptance/
          if-no-files-found: error
          retention-days: 90
