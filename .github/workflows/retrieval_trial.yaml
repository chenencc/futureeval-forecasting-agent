name: V103 paired evidence handoff
run-name: V103 context handoff / ${{ inputs.phase }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Frozen regression five or independent expansion ten; saved material only'
        type: choice
        options: ['regression', 'expansion']
        default: 'regression'
        required: true
      resume_run:
        description: 'Exact prior run whose case journals must be restored'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: v103-evidence-handoff-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject untracked reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Restore exact journals with resume_run; never restart an empty ledger.'
            exit 1
          fi
      - name: Check original context and failure recovery
        run: python -m unittest ForecastAgent.tests.test_v103_context_handoff ForecastAgent.tests.test_v103_handoff_trial -v
      - name: Check all fifteen immutable original packages without providers
        run: python -m ForecastAgent.acquisition.v103_handoff_trial --preflight --output snapshots/v103-handoff-offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: v103-handoff-offline-${{ github.run_id }}
          path: snapshots/v103-handoff-offline.json
          retention-days: 90

  compare:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        question: ${{ fromJSON(inputs.phase == 'regression' && '["36871","43494","43501","43991","44801"]' || '["44925","40938","43703","43709","44247","43844","43992","41090","43615","44448"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact previous case journals
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: v103-handoff-${{ inputs.phase }}-${{ matrix.question }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/v103-handoff/${{ matrix.question }}
      - name: Compare first and conditional final decisions on the same bodies
        run: python -u -m ForecastAgent.acquisition.v103_handoff_trial --output snapshots/v103-handoff --question-id "$CASE_ID"
        env:
          CASE_ID: ${{ matrix.question }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
      - name: Preserve original inputs and every reserved provider attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v103-handoff-${{ inputs.phase }}-${{ matrix.question }}
          path: snapshots/v103-handoff/${{ matrix.question }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
