name: Metaculus HF scheduled runner
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: collect-analyze
        options: [collect-analyze, live]
      limit:
        type: choice
        default: '1'
        options: ['1', '2', '3', '4', '5']
permissions:
  contents: read
concurrency:
  group: futureeval-official-worker
  cancel-in-progress: false
jobs:
  run:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.METACULUS_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: metaculus_hf
    env:
      HF_DATASET: chchen13/forecastagent-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      OPENROUTER_API_KEY2: ${{ secrets.OPENROUTER2 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      METACULUS_SUBMIT_ENABLED: ${{ vars.METACULUS_SUBMIT_ENABLED }}
      METACULUS_CHECKPOINT: ${{ vars.METACULUS_CHECKPOINT || 'metaculus/_control/checkpoint.json' }}
      METACULUS_WRITER: metaculus-agent-actions-v1
      FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m metaculus_agent.doctor
      - name: Collect, analyze, persist and optionally submit
        env:
          MODE: ${{ inputs.mode || (vars.METACULUS_SUBMIT_ENABLED == 'true' && 'live' || 'collect-analyze') }}
          TASK_LIMIT: ${{ inputs.limit || '1' }}
        run: python -B -m metaculus_agent.runner --mode "$MODE" --limit "$TASK_LIMIT"
      # Deliberately no upload-artifact or result ZIP. State lives in private HF.
