name: Referenced evidence analysis pilot
on:
  workflow_dispatch:
    inputs:
      source_run:
        type: string
        required: true
        default: '36948699455'
      resume_analysis_run:
        type: string
        default: ''
      supplement_run:
        type: string
        default: '36961850565'
        description: Completed supplemental campaign, or empty for original evidence only
      route_mode:
        type: choice
        options: [both, reasoning_only]
        default: both
      question_ids:
        type: string
        default: '41140'
permissions:
  contents: read
  actions: read
concurrency:
  group: referenced-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest ForecastAgent.tests.test_referenced_analysis ForecastAgent.tests.test_analysis_routes ForecastAgent.tests.test_analysis_recovery
      - uses: actions/download-artifact@v4
        with:
          name: raw-collection-100-v1-state
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/analysis-input
      - uses: actions/download-artifact@v4
        if: inputs.supplement_run != ''
        with:
          name: acquisition-supplement-100-v1
          run-id: ${{ inputs.supplement_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/analysis-supplement
      - uses: actions/download-artifact@v4
        if: inputs.resume_analysis_run != ''
        with:
          name: referenced-analysis-v8
          run-id: ${{ inputs.resume_analysis_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/analysis-v8
      - shell: bash
        run: |
          args=()
          if [ -n "$SUPPLEMENT_RUN" ]; then args+=(--supplement-root snapshots/analysis-supplement); fi
          python -m ForecastAgent.analysis.referenced --root snapshots/analysis-input --output snapshots/analysis-v8 --ids "$PILOT_IDS" --mode "$ROUTE_MODE" "${args[@]}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          PILOT_IDS: ${{ inputs.question_ids }}
          SUPPLEMENT_RUN: ${{ inputs.supplement_run }}
          ROUTE_MODE: ${{ inputs.route_mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referenced-analysis-v8
          path: snapshots/analysis-v8
          retention-days: 90



