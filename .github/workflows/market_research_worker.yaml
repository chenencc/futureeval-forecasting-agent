name: Market repricing research worker

on:
  workflow_dispatch:
    inputs:
      monitor_run_id:
        required: true
        type: string
        description: Exact trusted monitor artifact run
      verification_only:
        type: boolean
        required: true
        default: true
        description: Validate queue and development engine without model requests
      not_before:
        type: string
        required: false
        default: ''
        description: Recorded retry deadline; wait at most fifteen minutes
  workflow_run:
    workflows: ['Market repricing research monitor']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: market-repricing-worker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  research:
    if: (github.event_name == 'workflow_dispatch' && (inputs.verification_only || vars.MARKET_REPRICING_ENABLED == 'true')) || (github.event_name == 'workflow_run' && vars.MARKET_REPRICING_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER2 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_KEY3 }}
      TAVILY_API_KEY2: ${{ secrets.TAVILY_KEY4 }}
      EXA_API_KEY: ${{ secrets.EXA_API }}
      EXA_API_KEY2: ${{ secrets.EXA_API2 }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FORECAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
      FORECAST_MODEL_FALLBACK_SUPER: '0'
      SOURCE_RUN: ${{ inputs.monitor_run_id || github.event.workflow_run.id }}
      VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_only }}
      RETRY_NOT_BEFORE: ${{ inputs.not_before }}
      MARKET_PIPELINE_SHA: ${{ vars.MARKET_REPRICING_SHA }}
      FORECAST_ACQUISITION_SHA: ${{ vars.FORECAST_ACQUISITION_SHA }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.MARKET_REPRICING_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c17c1ec4ee3e2458108031a324b45853aa9e7502
          path: .development
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .transport
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official map core dependencies
        run: python -m pip install -r ForecastAgent/market_repricing/requirements-official-map.txt
      - name: Verify independent immutable market release
        run: |
          python -m ForecastAgent.market_repricing.deployment
          python .transport/ForecastAgent/infrastructure/unified_acquisition.py --core . --engine .development --expected-core "$FORECAST_ACQUISITION_SHA" --verify-only
      - name: Run independent sidecar regression gates
        run: python -m unittest discover -s ForecastAgent/market_repricing/tests -v
      - name: Wait within recorded retry deadline without provider calls
        if: env.RETRY_NOT_BEFORE != '' && env.VERIFY_ONLY != 'true'
        run: |
          python - <<'PY'
          import os, time
          from ForecastAgent.market_repricing.common import now, instant
          wait = (instant(os.environ['RETRY_NOT_BEFORE']) - instant(now())).total_seconds()
          if wait > 86400: raise ValueError('Retry deadline exceeds one day')
          time.sleep(max(0, min(900, wait)))
          PY
      - name: Restore exact worker checkpoint
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role worker --root snapshots/market-worker --branch "$GITHUB_REF_NAME"
      - name: Restore triggering trusted monitor checkpoint
        run: python .transport/ForecastAgent/infrastructure/market_checkpoint.py restore --role monitor --root snapshots/market-monitor --branch "$GITHUB_REF_NAME" --run-id "$SOURCE_RUN"
      - name: Validate pending market version compatibility
        run: python -m ForecastAgent.market_repricing.deployment --worker-root snapshots/market-worker --monitor-root snapshots/market-monitor
      - name: Verify queue before installing model and browser dependencies
        id: inventory
        run: |
          python -m ForecastAgent.market_repricing.runtime --engine .development --root snapshots/market-worker --monitor snapshots/market-monitor --verification-only
          python - <<'PY'
          import os
          from ForecastAgent.market_repricing.common import read, instant, now, policy
          from ForecastAgent.market_repricing.budgets import executions_used, availability
          state = read('snapshots/market-worker/state.json')
          cap = policy()['maximum_executions_per_task']
          pending = any(t['status'] in {'queued','retry_wait','running','budget_wait'} and executions_used(t) < cap and
              (not t.get('retry_at') or instant(t['retry_at']) <= instant(now())) and
              availability(state, key, policy()) is None for key,t in state['tasks'].items())
          ready = pending and os.environ['VERIFY_ONLY'] != 'true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
          PY
      - name: Install development crawler runtime
        if: steps.inventory.outputs.ready == 'true'
        run: |
          python -m pip install -r .development/ForecastAgent/requirements-crawl4ai.txt
          python -m playwright install --with-deps chromium
      - name: Run development research
        if: steps.inventory.outputs.ready == 'true'
        run: |
          args=()
          if [ "$VERIFY_ONLY" = 'true' ]; then args+=(--verification-only); fi
          python -m ForecastAgent.market_repricing.runtime --engine .development --root snapshots/market-worker --monitor snapshots/market-monitor "${args[@]}"
      - name: Evaluate due paired labels
        if: always()
        run: |
          if [ -f snapshots/market-worker/state.json ] && [ -f snapshots/market-monitor/state.json ]; then
            python -m ForecastAgent.market_repricing evaluate --root snapshots/market-monitor --worker snapshots/market-worker --output snapshots/market-worker/evaluation.json
            python -c "from ForecastAgent.market_repricing.common import seal; seal('snapshots/market-worker')"
          fi
      - name: Seal interrupted worker state
        if: always()
        run: |
          if [ -f snapshots/market-worker/state.json ]; then
            python -m ForecastAgent.market_repricing.deployment --record-root snapshots/market-worker
            python -c "from ForecastAgent.market_repricing.common import seal; seal('snapshots/market-worker')"
          fi
      - name: Build lossless per-task recovery packs
        if: always()
        id: packed
        run: |
          if [ -f snapshots/market-worker/state.json ]; then
            python .transport/ForecastAgent/infrastructure/market_checkpoint.py publish --root snapshots/market-worker --output snapshots/market-worker-packed
          else
            exit 1
          fi
      - name: Publish independent worker checkpoint
        if: always() && steps.packed.outcome == 'success'
        id: checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: market-repricing-v2-worker-state
          path: snapshots/market-worker-packed
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - name: Build lightweight local synchronization catalog
        id: local_catalog
        if: always() && steps.checkpoint.outcome == 'success'
        continue-on-error: true
        run: python .transport/ForecastAgent/infrastructure/local_sync_export.py --stream market-worker --source market-repricing-v2-worker-state=snapshots/market-worker-packed --summary-root market-repricing-v2-worker-state=snapshots/market-worker --source-id market-repricing-v2-worker-state=${{ steps.checkpoint.outputs.artifact-id }} --output snapshots/local-catalog
      - name: Publish lightweight local synchronization catalog
        if: always() && steps.local_catalog.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: forecast-local-catalog-v1-market-worker
          path: snapshots/local-catalog/
          retention-days: 90
          if-no-files-found: error
      - name: Write visible research summary
        if: always()
        run: |
          if [ -f snapshots/market-worker/report.json ]; then
            echo '## Development graph research; no orders or submissions' >> "$GITHUB_STEP_SUMMARY"
            cat snapshots/market-worker/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Continue remaining enrolled tasks after checkpoint upload
        if: success() && env.VERIFY_ONLY != 'true'
        run: python -m ForecastAgent.market_repricing.continuation --root snapshots/market-worker --monitor-run "$SOURCE_RUN"
