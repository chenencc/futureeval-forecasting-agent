name: Competition shared acquisition promotion gates
on:
  push:
    branches: [codex/competition-shared-p0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native release reader dependencies
        run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Verify exact release and shared capability manifests
        run: python -m ForecastAgent.releases.manifest
      - name: Native acquisition and unchanged analysis delivery gates
        run: python -m unittest ForecastAgent.tests.test_shared_acquisition_adapter ForecastAgent.tests.test_eager_capture ForecastAgent.tests.test_release_1_0_5 ForecastAgent.tests.test_supplement ForecastAgent.tests.test_nonbinary_distributions ForecastAgent.tests.test_competition_mercury -v
      - name: Find exact latest production checkpoint
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'official_competition.yaml',branch:'main',status:'completed',per_page:30});
            for(const run of data.workflow_runs){
              const {data:artifacts}=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id});
              if(artifacts.artifacts.some(a=>a.name==='futureeval-official-state'&&!a.expired)){
                core.setOutput('run_id',String(run.id));return;
              }
            }
            throw new Error('Missing official checkpoint; refuse bootstrap');
      - uses: actions/download-artifact@v4
        with:
          name: futureeval-official-state
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/official
      - name: Preserve task budgets and accepted submission receipts
        run: python -m ForecastAgent.integrations.shared_preservation --root snapshots/official --output snapshots/receipts/competition-preservation.json
      - uses: actions/upload-artifact@v4
        with:
          name: competition-shared-acquisition-preservation
          path: snapshots/receipts
          if-no-files-found: error
          retention-days: 30
