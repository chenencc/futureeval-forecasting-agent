name: Three live Ultra collection trials

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: three-live-ultra-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - name: Find completed durable ledgers
        id: previous
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            // Logs verified: these bootstrap runs failed before acquisition started.
            const bootstrapFailures = new Set([36720824958, 36721054237, 36721297660, 36718845323]);
            async function latest(workflow, artifact) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: workflow, status:'completed', per_page:30});
              for (const run of data.workflow_runs) {
                if (run.id === context.runId) continue;
                if (bootstrapFailures.has(run.id)) continue;
                const {data: list} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id:run.id});
                const state = list.artifacts.find(a => a.name === artifact && !a.expired);
                if (state) return {id:run.id, name:state.name};
                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id:run.id});
                const steps = jobs.jobs.flatMap(j => j.steps || []);
                const acquisition = steps.find(s => ['Run real Ultra acquisition without predictions','Save read-only question snapshot'].includes(s.name));
                const legacy = list.artifacts.find(a => a.name === `futureeval-questions-${run.id}` && !a.expired);
                if (workflow === 'run_bot_on_tournament.yaml' && run.conclusion === 'success' && legacy && !steps.some(s => s.name === 'Install free document parser')) return {id:run.id, name:legacy.name};
                if (acquisition && acquisition.conclusion === 'skipped') continue;
                throw new Error(`Run ${run.id} has no durable state and no confirmed skipped acquisition; refusing budget reset`);
              }
              return null;
            }
            const trial = await latest('live_collection_trial.yaml', 'live-collection-state');
            const monitor = await latest('run_bot_on_tournament.yaml', 'futureeval-monitor-state');
            core.setOutput('trial', trial?.id || '');
            core.setOutput('monitor', monitor?.id || '');
            core.setOutput('monitor_name', monitor?.name || '');
            core.setOutput('completed', [trial?.id, monitor?.id].filter(Boolean).join(','));
      - name: Restore existing trial selection and budgets
        if: steps.previous.outputs.trial != ''
        uses: actions/download-artifact@v4
        with:
          name: live-collection-state
          run-id: ${{ steps.previous.outputs.trial }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/live-collection/
      - name: Exclude already monitored task IDs
        if: steps.previous.outputs.monitor != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.monitor_name }}
          run-id: ${{ steps.previous.outputs.monitor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/live-collection/monitor-state/
      - name: Run real Ultra acquisition without predictions
        run: python -u -m ForecastAgent.live_collection_trial
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          FORECAST_COMPLETED_RESTORE_RUNS: ${{ steps.previous.outputs.completed }}
          FORECAST_RESTORED_STATE_ROOT: snapshots/live-collection
      - name: Preserve selection, budgets and source captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-collection-state
          path: snapshots/live-collection/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
