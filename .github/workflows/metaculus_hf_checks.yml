name: Metaculus HF source and recovery checks
on:
  push:
    paths: ['metaculus_hf/**', '.github/workflows/metaculus_hf_checks.yml']
  pull_request:
    paths: ['metaculus_hf/**', '.github/workflows/metaculus_hf_checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: metaculus_hf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaculus_hf/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m metaculus_agent.doctor
      - run: python -m unittest discover -s tests -v
