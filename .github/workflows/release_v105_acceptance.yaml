name: ForecastAgent v1.0.5 Linux acceptance
on:
  push:
    branches: ['release/v1.0.5']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-supplement.txt
      - name: Verify frozen release and analysis core
        run: |
          python -m ForecastAgent.releases.manifest
          python -c "from ForecastAgent.releases.v1_0_5 import verify_release; from ForecastAgent.acquisition.pipeline import verify_baseline; verify_release(); verify_baseline()"
      - name: Collection recovery and production fault regressions
        run: python -m unittest ForecastAgent.tests.test_collection_recovery ForecastAgent.tests.test_collection_actions ForecastAgent.tests.test_production_collection ForecastAgent.tests.test_supplement ForecastAgent.tests.test_release_1_0_5 -v
      - name: Public HTML and PDF capture probe
        run: python -m ForecastAgent.releases.collection_gate --urls-file ForecastAgent/tests/fixtures/production_46056_sources.json --output snapshots/v105-public-gate --fetch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-v105-acceptance-${{ github.run_id }}
          path: snapshots/v105-public-gate
          if-no-files-found: warn
          retention-days: 30
