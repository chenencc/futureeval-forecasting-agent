name: Market repricing development integration gates
on:
  push:
    paths: ['ForecastAgent/market_repricing/**', 'ForecastAgent/acquisition_shared/**', '.github/workflows/market_*']
  pull_request:
    paths: ['ForecastAgent/market_repricing/**', 'ForecastAgent/acquisition_shared/**', '.github/workflows/market_*']
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c17c1ec4ee3e2458108031a324b45853aa9e7502
          path: .development
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 16013ebf43373fc4c116e736e1b034a768f314b8
          path: .competition-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install saved-source structure parser
        run: python -m pip install lxml==6.1.1
      - name: Install optional official map research dependencies
        run: python -m pip install -r ForecastAgent/market_repricing/requirements-official-map.txt
      - name: Verify immutable independent market checkout
        run: MARKET_PIPELINE_SHA="$(git rev-parse HEAD)" python -m ForecastAgent.market_repricing.deployment
      - name: Offline sidecar gates
        run: python -m unittest discover -s ForecastAgent/market_repricing/tests -v
      - name: Shared credential router quota and reverse-failover gates
        run: python -m unittest ForecastAgent.infrastructure.test_provider_failover -v
      - name: Development collection and graph scoring integration
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_development_runtime -v
      - name: Eager capture and immutable evidence packet integration
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_capture_runtime -v
      - name: Public sheet cell coordinates and authentication stop rules
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_sheet_runtime -v
      - name: Shared capability engine activation and bounded model metadata
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_shared_runtime -v
      - name: Both deployed adapters consume exactly the same shared capability bytes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ForecastAgent.acquisition_shared import identity
          for name in ('__init__.py','contract.py','tool_output.py'):
              assert Path('ForecastAgent/acquisition_shared',name).read_bytes()==Path('.competition-core/ForecastAgent/acquisition_shared',name).read_bytes(),name
          assert json.loads(Path('.competition-core/ForecastAgent/releases/manifest.json').read_text())['shared_acquisition']==identity()
          PY
      - name: Production official map and three-arm failure isolation
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_official_runtime -v
      - name: Mixed Basic Advanced search and durable quota integration
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_search_runtime -v
      - name: Whole-span context delivery and non-HTTP handoff preservation
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_context_runtime -v
