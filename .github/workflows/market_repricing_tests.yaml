name: Market repricing development integration gates
on:
  push:
    paths: ['ForecastAgent/market_repricing/**', '.github/workflows/market_*']
  pull_request:
    paths: ['ForecastAgent/market_repricing/**', '.github/workflows/market_*']
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c17c1ec4ee3e2458108031a324b45853aa9e7502
          path: .development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline sidecar gates
        run: python -m unittest discover -s ForecastAgent/market_repricing/tests -v
      - name: Development collection and graph scoring integration
        env:
          MARKET_ENGINE_DIRECTORY: ${{ github.workspace }}/.development
        run: python -m ForecastAgent.market_repricing.tests.verify_development_runtime -v
