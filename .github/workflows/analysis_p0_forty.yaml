name: Matched original coverage condition bindings experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Frozen forty replay or twenty new binary paired cases
        type: choice
        options: [forty, holdout20, recollect120]
        default: forty
      pilot_only:
        description: Run only the first five binary cases before expanding
        type: boolean
        default: true
      resume_run:
        description: Restore exact experiment journals without resetting allowances
        required: false
permissions:
  contents: read
  actions: write
concurrency:
  group: ${{ inputs.experiment == 'recollect120' && 'recollection-120-v1' || 'analysis-matched-forty' }}
  cancel-in-progress: false
jobs:
  paired:
    if: inputs.experiment != 'recollect120'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(inputs.experiment == 'holdout20' && '{"cohort":["binary"],"batch":[1,2,3,4]}' || inputs.pilot_only && '{"include":[{"cohort":"binary","batch":1}]}' || '{"cohort":["binary","nonbinary"],"batch":[1,2,3,4]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-retrieval.txt
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary'
        with:
          name: raw-collection-100-v1-state
          run-id: 36948699455
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/raw
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary'
        with:
          name: acquisition-supplement-100-v1
          run-id: 36961850565
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/supplements
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'binary' && inputs.experiment != 'holdout20'
        with:
          name: mercury-evidence-chain-twenty-batch-${{ matrix.batch }}
          run-id: 37022482053
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/baseline
      - uses: actions/download-artifact@v4
        if: matrix.cohort == 'nonbinary'
        with:
          name: nonbinary-full-pipeline-batch-${{ matrix.batch }}
          run-id: 37031590213
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/raw
      - name: Check whether the parent run contains this batch journal
        id: resume_artifact
        if: inputs.resume_run != ''
        shell: bash
        run: |
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN/artifacts" --paginate --jq ".artifacts | any(.name == \"$ARTIFACT_NAME\" and .expired == false)")
          if printf '%s\n' "$available" | grep -qx true; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No saved journal for this batch in the parent run; start its new tasks."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_RUN: ${{ inputs.resume_run }}
          ARTIFACT_NAME: ${{ inputs.experiment == 'holdout20' && 'analysis-holdout' || 'analysis-matched' }}-${{ matrix.cohort }}-batch-${{ matrix.batch }}
      - uses: actions/download-artifact@v4
        if: steps.resume_artifact.outputs.available == 'true'
        with:
          name: ${{ inputs.experiment == 'holdout20' && 'analysis-holdout' || 'analysis-matched' }}-${{ matrix.cohort }}-batch-${{ matrix.batch }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/paired
      - name: Replay preserved collection and repair then analyze with Mercury
        if: inputs.experiment != 'holdout20'
        run: python -m ForecastAgent.analysis.checked_snapshot_trial --cohort "$COHORT" --batch "$BATCH" --raw snapshots/raw --supplements snapshots/supplements --baseline snapshots/baseline --output snapshots/paired --strategy matched
        env:
          COHORT: ${{ matrix.cohort }}
          BATCH: ${{ matrix.batch }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      - name: Fresh old and condition routes on unseen binary cases
        if: inputs.experiment == 'holdout20'
        run: python -m ForecastAgent.analysis.holdout_twenty --batch "$BATCH" --raw snapshots/raw --supplements snapshots/supplements --output snapshots/paired
        env:
          BATCH: ${{ matrix.batch }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.experiment == 'holdout20' && 'analysis-holdout' || 'analysis-matched' }}-${{ matrix.cohort }}-batch-${{ matrix.batch }}
          path: snapshots/paired
          retention-days: 90


  recollect:
    if: inputs.experiment == 'recollect120'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CAMPAIGN_ROOT: snapshots/recollection-120-v1
      FORECAST_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      FORECAST_MODEL_FALLBACK_SUPER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ForecastAgent/requirements-supplement.txt
      - run: python -m playwright install --with-deps chromium
      - name: Locate exact previous recollection state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch=context.ref.replace('refs/heads/','');
            const runs=await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner,repo,workflow_id:'analysis_p0_forty.yaml',branch,status:'completed',per_page:100});
            for(const run of runs){
              if(run.id===context.runId)continue;
              const arts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id});
              const saved=arts.find(a=>a.name==='recollection-120-v1-state'&&!a.expired);
              if(saved){
                if(run.head_sha!==context.sha)throw new Error('Frozen recollection code changed; inspect preserved state');
                core.setOutput('run',String(run.id));return;
              }
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id});
              if(jobs.flatMap(j=>j.steps||[]).some(s=>s.name==='Full collection dispatch'&&s.conclusion!=='skipped'))
                throw new Error('Consumed recollection state missing; refusing allowance reset');
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          name: recollection-120-v1-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: snapshots/recollection-120-v1
      - name: Full collection dispatch
        run: python -u -m ForecastAgent.recollection --root "$CAMPAIGN_ROOT"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY1 }}
          EXA_API_KEY: ${{ secrets.EXA_API }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recollection-120-v1-state
          path: snapshots/recollection-120-v1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Continue the preserved queue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const plan=JSON.parse(fs.readFileSync('snapshots/recollection-120-v1/continuation.json','utf8'));
            if(plan.action!=='dispatch'){core.info('Stopped: '+plan.reason);return;}
            const deadline=plan.wait_until_utc?Date.parse(plan.wait_until_utc):0;
            if(!Number.isFinite(deadline)||deadline-Date.now()>3*60*60*1000)
              throw new Error('Retry exceeds bounded wait; state preserved for review');
            while(Date.now()<deadline)await new Promise(r=>setTimeout(r,Math.min(30000,deadline-Date.now())));
            const {owner,repo}=context.repo;
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'analysis_p0_forty.yaml',
              ref:context.ref.replace('refs/heads/',''),inputs:{experiment:'recollect120',pilot_only:'false'}});
